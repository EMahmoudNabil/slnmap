name: Release

# Releases are cut by pushing a semver tag: `git tag v0.2.0 && git push origin v0.2.0`.
# The tag (minus the leading `v`) becomes the package version, so the tag is the single
# source of truth for the version — no need to edit the csproj for a release.

on:
  push:
    tags: ['v*.*.*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build slnmap-ts (the analyze-ts test suite needs a real dist/cli.js)
        working-directory: src/slnmap-ts
        run: |
          npm ci
          npm run build

      - name: Link slnmap-ts onto PATH (v0.13.0 CI fix)
        # See ci.yml for the full writeup. Also fixes the specific circularity a NuGet-before-npm
        # release order otherwise hits: this workflow's own Test step would need the tag's
        # slnmap-ts version already live on npm, which is exactly what "NuGet first" defers.
        # Linking THIS build onto PATH means the release's own tests never depend on the
        # registry at all.
        working-directory: src/slnmap-ts
        run: npm link

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: dotnet pack src/Slnmap.Cli/Slnmap.Cli.csproj --no-build --configuration Release -p:Version=${{ steps.version.outputs.value }} -o artifacts

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
