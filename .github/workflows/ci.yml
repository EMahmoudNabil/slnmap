name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Add '10.0.x' to this list to also test on .NET 10 (one-line change).
        dotnet: ['9.0.x']
    runs-on: ${{ matrix.os }}
    # Belt-and-suspenders against a hung test process (see issue #10): the job itself is capped
    # well above the slowest known-good run (~16 min on ubuntu-latest), so a stall fails the job
    # instead of idling for GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build slnmap-ts (the analyze-ts test suite needs a real dist/cli.js)
        working-directory: src/slnmap-ts
        run: |
          npm ci
          npm run build

      - name: Warm the npx cache for slnmap-ts (avoids a concurrent cold-install race)
        # Several test classes shell out to the real CLI, which falls back to `npx --yes
        # --package=slnmap-ts@<pinned>` since slnmap-ts isn't on PATH here. xUnit runs those
        # classes in parallel by default, so without this step multiple cold npx installs race
        # to extract into the same shared npm cache directory at once. Windows can't
        # rename/delete a directory that still has open handles the way POSIX can, so that race
        # surfaced as `npm error ENOTEMPTY` on windows-latest only (never on Ubuntu). Installing
        # once, serialized, before the parallel test run removes the race entirely.
        # slnmap-ts has no --version flag, so this exits 1 with a usage message — that's fine,
        # the only goal is to force npm to finish downloading and extracting the package into
        # the shared cache before any parallel test tries to.
        shell: bash
        run: npx --yes --package=slnmap-ts@0.2.1 slnmap-ts --version || true

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        # --blame-hang-timeout converts a stalled test into a clear failure (with a hang dump)
        # well before the job-level timeout-minutes above would otherwise have to catch it.
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx" --blame-hang-timeout 5m --blame-hang-dump-type mini

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.dotnet }}
          path: '**/TestResults/*.trx'

      - name: Upload hang dump (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hang-dump-${{ matrix.os }}-${{ matrix.dotnet }}
          path: '**/TestResults/**/*.dmp'
          if-no-files-found: ignore
